spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ta4}
    username: ${DB_USER:ta4}
    password: ${DB_PASSWORD:ta4}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
scalar:
  enabled: true
  url: /v3/api-docs
springdoc:
  show-actuator: true
ta4:
  ruc:
    # Carpeta de archivos por trabajo: <storage-dir>/<jobId>/{input.xlsx,input.txt,result.zip,result.txt}
    storage-dir: ${RUC_STORAGE_DIR:./ruc-jobs}
    max-rows: ${RUC_MAX_ROWS:20}
  # Fuente alternativa (plan C) cuando SUNAT bloquea al robot: API de consultaderuc.pe. Sin token queda desactivada.
  ruc-api:
    base-url: ${CONSULTA_RUC_API_URL:https://consultaderuc.pe}
    token: ${CONSULTA_RUC_API_TOKEN:}
    # Si el robot falla, usar la API solo. Poner false para que sea el usuario quien lo pida con el botón.
    auto-fallback: ${CONSULTA_RUC_API_AUTO_FALLBACK:true}
  # Panel del bot: túnel, webhook de Telegram, chats en vivo. Los secretos llegan por variables de entorno.
  bot:
    admin-key: ${ADMIN_KEY:}
    ingest-key: ${BOT_INGEST_KEY:}
    telegram-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    gemini-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    n8n-base-url: ${N8N_BASE_URL:http://n8n:5678}
    tunnel-metrics-url: ${TUNNEL_METRICS_URL:http://cloudflared:2000}
