@let view = presenter.view(item().state);
<section class="bg-surface border-border animate-rise flex h-full flex-col gap-2 rounded-lg border p-4 shadow-[var(--shadow-card)]">
  <div class="flex items-center justify-between gap-2">
    <h3 class="text-sm font-semibold">{{ item().label }}</h3>
    <span class="inline-flex items-center gap-1.5 rounded-full px-2 py-0.5 text-xs font-medium" [class]="view.badge">
      <span class="h-1.5 w-1.5 rounded-full" [class]="view.dot" aria-hidden="true"></span>
      {{ view.word }}
    </span>
  </div>
  <p class="text-muted text-sm break-words">{{ item().detail }}</p>
  <div class="mt-auto"><ng-content /></div>
</section>
